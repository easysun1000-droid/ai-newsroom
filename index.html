<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 수업 뉴스룸</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="container">
    <h1 class="logo">AI 수업 뉴스룸</h1>
    <p class="subtitle">초등부터 성인까지 수준에 맞게 쉽게 보는 AI 뉴스</p>
  </div>
</header>

<main class="container">
  <section class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">학습대상</span>
      <div class="level-selector">
        <button data-level="all" class="level-btn active">전체</button>
        <button data-level="elementary" class="level-btn">초등</button>
        <button data-level="middle" class="level-btn">중등</button>
        <button data-level="high" class="level-btn">고등</button>
        <button data-level="adult" class="level-btn">성인</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">기간</span>
      <div class="date-selector">
        <button data-range="today" class="date-btn">오늘</button>
        <button data-range="7d" class="date-btn active">최근7일</button>
        <button data-range="30d" class="date-btn">최근30일</button>
        <button data-range="all" class="date-btn">전체</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">카테고리</span>
      <select id="categorySelect" class="select">
        <option value="all">전체</option>
      </select>
    </div>
    <div class="filter-group search-group">
      <input id="searchInput" type="search" placeholder="검색어 입력" class="search-input">
    </div>
  </section>

  <section class="news-grid" id="newsGrid">
    <!-- 카드가 JS에 의해 렌더링됨 -->
  </section>

  <div id="loadMoreWrap" class="load-more-wrap" style="display:none">
    <button id="loadMoreBtn" class="load-more-btn">더 보기</button>
  </div>

  <p class="sample-note">* 실제 뉴스와 예시 뉴스가 필터로 구분됩니다.</p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
